<!DOCTYPE html>

<html lang="pt-BR">

<head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PyClima - Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f2f5f7;
        padding: 30px;
    }

    h1 {
        text-align: center;
        margin-bottom: 30px;
    }

    .graficos {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 25px;
        max-width: 1200px;
        margin: auto;
    }

    .card {
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .card h2 {
        margin-bottom: 20px;
    }

    canvas {
        width: 100% !important;
        height: 350px !important;
    }

    @media (max-width: 800px) {
        .graficos {
            grid-template-columns: 1fr;
        }
    }
</style>

</head>

<body>

<h1>🌦️ PyClima</h1>

<div class="graficos">

    <div class="card">
        <h2>🌡️ Temperatura</h2>
        <canvas id="graficoTemperatura"></canvas>
    </div>

    <div class="card">
        <h2>💧 Umidade</h2>
        <canvas id="graficoUmidade"></canvas>
    </div>

</div>

<script>

    async function carregarDados() {

        const resposta = await fetch("/sensores");

        const dados = await resposta.json();

        const datas = dados.map(item => item.data_hora);
        const temperaturas = dados.map(item => item.temperatura);
        const umidades = dados.map(item => item.umidade);


        // GRÁFICO DE TEMPERATURA

        new Chart(
            document.getElementById("graficoTemperatura"),
            {
                type: "line",

                data: {
                    labels: datas,

                    datasets: [
                        {
                            label: "Temperatura (°C)",
                            data: temperaturas,
                            tension: 0.3,
                            fill: false
                        }
                    ]
                },

                options: {
                    responsive: true,

                    scales: {
                        y: {
                            beginAtZero: false
                        }
                    }
                }
            }
        );


        // GRÁFICO DE UMIDADE

        new Chart(
            document.getElementById("graficoUmidade"),
            {
                type: "line",

                data: {
                    labels: datas,

                    datasets: [
                        {
                            label: "Umidade (%)",
                            data: umidades,
                            tension: 0.3,
                            fill: false
                        }
                    ]
                },

                options: {
                    responsive: true,

                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100
                        }
                    }
                }
            }
        );

    }

    carregarDados();

</script>

</body>

</html>
